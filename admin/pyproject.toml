[project]
name = "douyin-admin"
version = "0.1.0"
description = "抖音续火花管理后台"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.142.2",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.32",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
]

[tool.uv]
package = false
# 只使用两周前已发布的版本，保证依赖可复现
exclude-newer = "2026-10-01T00:00:00Z"
